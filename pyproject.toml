# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
# `engine` IS checked. The manifest-derived overrides below exempt the
# vendored modules by exact name, so anything new under engine/ -- T6's
# analyst nodes -- is type-checked from its first commit.
files = ["desk", "tests", "engine", "scripts"]
# scripts/ is on the path so tests/ can import vendor_engine, which they do
# to derive the expected mypy module list from mypy's own resolver.
mypy_path = "scripts"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
# NOT `ignore_missing_imports = true` globally -- that silently disables type
# checking against every dependency.
#
# There is deliberately no overrides block yet. T1 imports none of the untyped
# libraries, and `warn_unused_configs` correctly flags a pre-declared exemption
# for an import that does not exist. T2 adds entries here as it actually
# imports yfinance / finvizfinance / financetoolkit -- one module at a time,
# each a review-worthy change. See internal-docs/VENDORING.md section 4.
#
# pandas is typed via `pandas-stubs` (a dev dependency), not exempted.

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# `engine` is here explicitly: ruff's and mypy's exclusions do not stop pytest
# collecting anything under it. Upstream's own tests/ are not vendored, but a
# stray test-shaped file in vendored source would still be collected.
norecursedirs = [".venv", "build", "dist", "engine"]
addopts = "-ra --strict-markers"

# ---------------------------------------------------------------------------
# Vendored-engine type exemptions.
# Generated from engine/.vendored-manifest by `make tooling-config`.
# mypy's `exclude` does NOT stop analysis of an excluded module that is
# imported, so this must be per-module `ignore_errors`, not an exclude.
# Measured 2026-08-19: without this, mypy reports 100 errors in 39 files.
# ---------------------------------------------------------------------------
[[tool.mypy.overrides]]
module = [
    # BEGIN vendored (generated by `make tooling-config`) -- do not hand-edit
    "cli",
